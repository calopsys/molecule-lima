[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-lima"
dynamic = ["version"]
description = "Molecule driver for Lima VM - Test Ansible roles on Linux"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Bastien Ogier", email = "bastien.ogier@calopsys.fr"}
]
maintainers = [
    {name = "Bastien Ogier", email = "bastien.ogier@calopsys.fr"}
]
keywords = [
    "ansible",
    "molecule",
    "testing",
    "lima",
    "virtualization",
    "linux"
]
requires-python = ">=3.13"
dependencies = [
    "molecule>=26.11.0",
    "ansible-core>=2.22.0",
    "pyyaml>=6.0.4",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]
test = [
    "pytest>=9.2.0",
]

[project.urls]
Homepage = "https://github.com/calopsys/molecule-lima"
Repository = "https://github.com/calopsys/molecule-lima"

[project.entry-points."molecule.driver"]
molecule-lima = "molecule_lima.driver:Lima"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["molecule_lima*"]

[tool.setuptools.package-data]
molecule_lima = ["playbooks/**/*.yml"]

[tool.setuptools.dynamic]
version = { attr = "molecule_lima.__version__" }
